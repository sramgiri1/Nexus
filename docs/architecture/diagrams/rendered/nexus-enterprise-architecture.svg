<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS Agentic OS - Enterprise Architecture</title>
  <desc id="desc">Public-safe current-state NEXUS enterprise architecture showing founder inputs, trusted context, Command Center, kernel governance, agents, governed tools, runtime, delivery, durable state, security, observability, and human approval boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <style>
      .page { fill: #f8fbff; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #0b1535; font-size: 30px; font-weight: 800; }
      .subtitle { fill: #40546f; font-size: 14px; font-weight: 600; }
      .section { fill: #ffffff; stroke-width: 2; }
      .blue { stroke: #2b6cb0; }
      .teal { stroke: #1f7a7a; }
      .purple { stroke: #5b3aa4; }
      .orange { stroke: #d97706; }
      .green { stroke: #087f5b; }
      .navy { stroke: #1f4e79; }
      .slate { stroke: #64748b; }
      .violet { stroke: #6d28d9; }
      .header { fill: #0f2742; font-size: 14px; font-weight: 800; }
      .num { fill: #ffffff; font-size: 14px; font-weight: 800; }
      .numBlue { fill: #1652a2; }
      .numTeal { fill: #0f766e; }
      .numPurple { fill: #5b21b6; }
      .numOrange { fill: #ea580c; }
      .numGreen { fill: #047857; }
      .numNavy { fill: #1d4ed8; }
      .numSlate { fill: #475569; }
      .numViolet { fill: #7c3aed; }
      .pill { fill: #f8fafc; stroke: #b6c4d6; stroke-width: 1.2; }
      .pillText { fill: #1e293b; font-size: 10.5px; font-weight: 700; }
      .note { fill: #334155; font-size: 11px; font-weight: 700; }
      .small { fill: #475569; font-size: 10.5px; font-weight: 600; }
      .status { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.4; }
      .statusText { fill: #166534; font-size: 11px; font-weight: 800; }
      .blocked { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .blockedText { fill: #9a3412; font-size: 11px; font-weight: 800; }
      .arrow { stroke: #1f4e79; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1280" class="page"/>
  <text x="195" y="42" class="title">NEXUS Agentic OS - Enterprise Architecture</text>
  <text x="170" y="68" class="subtitle">Governed founder-to-business operating system for planning, building, validating, and shipping products</text>

  <g id="row-one">
    <rect x="24" y="98" width="220" height="220" rx="12" class="section blue"/>
    <circle cx="52" cy="123" r="14" class="numBlue"/><text x="48" y="129" class="num">1</text>
    <text x="76" y="128" class="header">Founder Inputs</text>
    <rect x="42" y="148" width="184" height="28" rx="6" class="pill"/><text x="74" y="166" class="pillText">Founder goals</text>
    <rect x="42" y="182" width="184" height="28" rx="6" class="pill"/><text x="74" y="200" class="pillText">Idea validation</text>
    <rect x="42" y="216" width="184" height="28" rx="6" class="pill"/><text x="74" y="234" class="pillText">PRD and scope</text>
    <rect x="42" y="250" width="184" height="28" rx="6" class="pill"/><text x="74" y="268" class="pillText">Repo state</text>
    <rect x="42" y="284" width="184" height="28" rx="6" class="pill"/><text x="74" y="302" class="pillText">Policies and signals</text>

    <rect x="274" y="98" width="220" height="220" rx="12" class="section teal"/>
    <circle cx="302" cy="123" r="14" class="numTeal"/><text x="298" y="129" class="num">2</text>
    <text x="326" y="128" class="header">Trusted Context</text>
    <rect x="292" y="148" width="184" height="28" rx="6" class="pill"/><text x="326" y="166" class="pillText">Project registry</text>
    <rect x="292" y="182" width="184" height="28" rx="6" class="pill"/><text x="326" y="200" class="pillText">Stack profile</text>
    <rect x="292" y="216" width="184" height="28" rx="6" class="pill"/><text x="326" y="234" class="pillText">Trusted context</text>
    <rect x="292" y="250" width="184" height="28" rx="6" class="pill"/><text x="326" y="268" class="pillText">Scoped memory</text>
    <rect x="292" y="284" width="184" height="28" rx="6" class="pill"/><text x="326" y="302" class="pillText">Context packets</text>

    <rect x="524" y="98" width="452" height="220" rx="12" class="section purple"/>
    <circle cx="552" cy="123" r="14" class="numPurple"/><text x="548" y="129" class="num">3</text>
    <text x="576" y="128" class="header">Command Center and Control Plane</text>
    <rect x="548" y="150" width="126" height="44" rx="7" class="pill"/><text x="578" y="176" class="pillText">Chat with NEXUS</text>
    <rect x="688" y="150" width="126" height="44" rx="7" class="pill"/><text x="718" y="176" class="pillText">Founder Intake</text>
    <rect x="828" y="150" width="126" height="44" rx="7" class="pill"/><text x="858" y="176" class="pillText">Business Build</text>
    <rect x="548" y="204" width="126" height="44" rx="7" class="pill"/><text x="584" y="230" class="pillText">Agent Flow</text>
    <rect x="688" y="204" width="126" height="44" rx="7" class="pill"/><text x="720" y="230" class="pillText">Live Readiness</text>
    <rect x="828" y="204" width="126" height="44" rx="7" class="pill"/><text x="862" y="230" class="pillText">OS Roadmap</text>
    <rect x="548" y="258" width="126" height="34" rx="7" class="pill"/><text x="584" y="280" class="pillText">DB Runtime</text>
    <rect x="688" y="258" width="126" height="34" rx="7" class="pill"/><text x="721" y="280" class="pillText">Activity Log</text>
    <rect x="828" y="258" width="126" height="34" rx="7" class="pill"/><text x="858" y="280" class="pillText">Policy / Cost</text>
  </g>

  <path d="M244 208 H274" class="arrow"/>
  <path d="M494 208 H524" class="arrow"/>

  <g id="kernel">
    <rect x="24" y="348" width="952" height="128" rx="12" class="section orange"/>
    <circle cx="52" cy="373" r="14" class="numOrange"/><text x="48" y="379" class="num">4</text>
    <text x="76" y="378" class="header">NEXUS Kernel</text>
    <rect x="42" y="400" width="100" height="34" rx="7" class="pill"/><text x="72" y="422" class="pillText">Router</text>
    <rect x="154" y="400" width="100" height="34" rx="7" class="pill"/><text x="178" y="422" class="pillText">Scheduler</text>
    <rect x="266" y="400" width="100" height="34" rx="7" class="pill"/><text x="291" y="422" class="pillText">Governor</text>
    <rect x="378" y="400" width="100" height="34" rx="7" class="pill"/><text x="398" y="422" class="pillText">Validator</text>
    <rect x="490" y="400" width="100" height="34" rx="7" class="pill"/><text x="513" y="422" class="pillText">State Machine</text>
    <rect x="602" y="400" width="112" height="34" rx="7" class="pill"/><text x="625" y="422" class="pillText">Capability</text>
    <rect x="726" y="400" width="100" height="34" rx="7" class="pill"/><text x="748" y="422" class="pillText">Budget</text>
    <rect x="838" y="400" width="112" height="34" rx="7" class="pill"/><text x="862" y="422" class="pillText">Recovery</text>
    <rect x="42" y="448" width="908" height="18" rx="9" class="blocked"/><text x="350" y="461" class="blockedText">Live authority remains gated until a future explicit activation contract</text>
  </g>

  <path d="M750 318 V348" class="arrow"/>

  <g id="agents">
    <rect x="24" y="506" width="952" height="104" rx="12" class="section navy"/>
    <circle cx="52" cy="531" r="14" class="numNavy"/><text x="48" y="537" class="num">5</text>
    <text x="76" y="536" class="header">Multi-Agent Intelligence Layer</text>
    <text x="390" y="536" class="small">Agents plan and propose; kernel governs execution.</text>
    <rect x="52" y="562" width="132" height="30" rx="7" class="pill"/><text x="96" y="582" class="pillText">Strategy</text>
    <rect x="200" y="562" width="132" height="30" rx="7" class="pill"/><text x="244" y="582" class="pillText">Product</text>
    <rect x="348" y="562" width="132" height="30" rx="7" class="pill"/><text x="396" y="582" class="pillText">Build</text>
    <rect x="496" y="562" width="132" height="30" rx="7" class="pill"/><text x="540" y="582" class="pillText">Platform</text>
    <rect x="644" y="562" width="132" height="30" rx="7" class="pill"/><text x="686" y="582" class="pillText">Verification</text>
    <rect x="792" y="562" width="140" height="30" rx="7" class="pill"/><text x="814" y="582" class="pillText">Growth / Observability</text>
  </g>

  <path d="M500 476 V506" class="arrow"/>

  <g id="gateway">
    <rect x="24" y="638" width="952" height="126" rx="12" class="section green"/>
    <circle cx="52" cy="663" r="14" class="numGreen"/><text x="48" y="669" class="num">6</text>
    <text x="76" y="668" class="header">Governed Tool Gateway</text>
    <text x="390" y="668" class="small">Loaded on demand; not active by default.</text>
    <rect x="52" y="690" width="116" height="30" rx="7" class="pill"/><text x="82" y="710" class="pillText">Skill Registry</text>
    <rect x="180" y="690" width="116" height="30" rx="7" class="pill"/><text x="210" y="710" class="pillText">Hook Registry</text>
    <rect x="308" y="690" width="116" height="30" rx="7" class="pill"/><text x="340" y="710" class="pillText">Tool Registry</text>
    <rect x="436" y="690" width="116" height="30" rx="7" class="pill"/><text x="468" y="710" class="pillText">MCP Registry</text>
    <rect x="564" y="690" width="116" height="30" rx="7" class="pill"/><text x="598" y="710" class="pillText">CLI Adapter</text>
    <rect x="692" y="690" width="116" height="30" rx="7" class="pill"/><text x="726" y="710" class="pillText">API Adapter</text>
    <rect x="820" y="690" width="116" height="30" rx="7" class="pill"/><text x="848" y="710" class="pillText">Batch Adapter</text>
    <rect x="52" y="730" width="884" height="18" rx="9" class="blocked"/><text x="230" y="743" class="blockedText">Provider calls, mutation tools, DB writes, deploy, network calls, and spend require approval gates</text>
  </g>

  <path d="M500 610 V638" class="arrow"/>

  <g id="runtime-delivery">
    <rect x="24" y="792" width="952" height="82" rx="12" class="section teal"/>
    <circle cx="52" cy="817" r="14" class="numTeal"/><text x="48" y="823" class="num">7</text>
    <text x="76" y="822" class="header">Runtime and Execution Layer</text>
    <rect x="304" y="812" width="102" height="30" rx="7" class="pill"/><text x="334" y="832" class="pillText">Local API</text>
    <rect x="418" y="812" width="118" height="30" rx="7" class="pill"/><text x="444" y="832" class="pillText">Action Bridge</text>
    <rect x="548" y="812" width="118" height="30" rx="7" class="pill"/><text x="574" y="832" class="pillText">Worker Queue</text>
    <rect x="678" y="812" width="118" height="30" rx="7" class="pill"/><text x="704" y="832" class="pillText">Runtime Engine</text>
    <rect x="808" y="812" width="126" height="30" rx="7" class="pill"/><text x="836" y="832" class="pillText">Provider Gate</text>

    <rect x="24" y="902" width="952" height="82" rx="12" class="section blue"/>
    <circle cx="52" cy="927" r="14" class="numBlue"/><text x="48" y="933" class="num">8</text>
    <text x="76" y="932" class="header">Founder Product Delivery Layer</text>
    <rect x="304" y="922" width="102" height="30" rx="7" class="pill"/><text x="342" y="942" class="pillText">PRD</text>
    <rect x="418" y="922" width="118" height="30" rx="7" class="pill"/><text x="448" y="942" class="pillText">Workstreams</text>
    <rect x="548" y="922" width="118" height="30" rx="7" class="pill"/><text x="584" y="942" class="pillText">Backend</text>
    <rect x="678" y="922" width="94" height="30" rx="7" class="pill"/><text x="712" y="942" class="pillText">Web</text>
    <rect x="784" y="922" width="74" height="30" rx="7" class="pill"/><text x="810" y="942" class="pillText">iOS</text>
    <rect x="870" y="922" width="64" height="30" rx="7" class="pill"/><text x="890" y="942" class="pillText">Ship</text>
  </g>

  <path d="M500 764 V792" class="arrow"/>
  <path d="M500 874 V902" class="arrow"/>

  <g id="state-governance">
    <rect x="24" y="1012" width="952" height="70" rx="12" class="section slate"/>
    <circle cx="52" cy="1037" r="14" class="numSlate"/><text x="48" y="1043" class="num">9</text>
    <text x="76" y="1042" class="header">Durable State and Evidence</text>
    <text x="308" y="1042" class="small">Local files, SQLite, task store, audit, evidence, artifacts, cost, policy, activity</text>

    <rect x="24" y="1110" width="462" height="70" rx="12" class="section violet"/>
    <circle cx="52" cy="1135" r="14" class="numViolet"/><text x="44" y="1141" class="num">10</text>
    <text x="84" y="1140" class="header">Security Identity and Governance</text>
    <text x="84" y="1162" class="small">Identity, RBAC, secrets, classification, network, approval, compliance, isolation</text>

    <rect x="514" y="1110" width="462" height="70" rx="12" class="section purple"/>
    <circle cx="542" cy="1135" r="14" class="numPurple"/><text x="534" y="1141" class="num">11</text>
    <text x="574" y="1140" class="header">Reliability and Observability</text>
    <text x="574" y="1162" class="small">Telemetry, traces, logs, evals, incidents, recovery, rollback, health</text>
  </g>

  <path d="M500 984 V1012" class="arrow"/>

  <g id="human">
    <rect x="24" y="1206" width="250" height="34" rx="17" class="status"/>
    <text x="52" y="1228" class="statusText">P145.7 final validation complete</text>
    <rect x="300" y="1206" width="370" height="34" rx="17" class="blocked"/>
    <text x="322" y="1228" class="blockedText">Live autonomous execution requires future activation</text>
    <text x="700" y="1221" class="note">Right context. Right agent.</text>
    <text x="700" y="1236" class="note">Right tool. Right cost. Always governed.</text>
  </g>
</svg>
